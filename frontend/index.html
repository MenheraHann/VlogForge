<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VlogForge - AI Vlog 带货视频生成器</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ========== 背景装饰 ========== -->
  <div class="bg-gradient"></div>
  <div class="bg-noise"></div>

  <!-- ========== Step 1: 输入 ========== -->
  <section id="step-input" class="step active">
    <div class="container">
      <!-- 头部 -->
      <header class="hero">
        <div class="logo">
          <span class="logo-icon">&#9655;</span>
          <span class="logo-text">VlogForge</span>
        </div>
        <p class="hero-subtitle">AI 驱动的 Vlog 带货视频生成器</p>
        <p class="hero-desc">填写产品信息，一键生成真人 vlog 风格的带货短视频</p>
      </header>

      <!-- 表单卡片 -->
      <form id="generate-form" class="card glass-card">
        <div class="form-grid">
          <!-- 产品类型 -->
          <div class="form-group">
            <label for="product_type">产品类型</label>
            <input type="text" id="product_type" name="product_type"
                   placeholder="如：氨基酸洗面奶、保湿面膜" required>
          </div>

          <!-- 核心卖点 -->
          <div class="form-group">
            <label for="selling_point">核心卖点</label>
            <input type="text" id="selling_point" name="selling_point"
                   placeholder="如：氨基酸温和配方，洗完不紧绷" required>
          </div>

          <!-- 使用方式 -->
          <div class="form-group full-width">
            <label for="product_usage">使用方式</label>
            <textarea id="product_usage" name="product_usage" rows="2"
                      placeholder="如：挤出泡沫涂在脸上，打圈按摩 30 秒，清水冲洗" required></textarea>
          </div>

          <!-- 目标平台 -->
          <div class="form-group">
            <label for="platform">目标平台</label>
            <div class="select-wrapper">
              <select id="platform" name="platform" required>
                <option value="douyin">抖音 (9:16 竖屏)</option>
                <option value="xiaohongshu">小红书 (9:16 竖屏)</option>
                <option value="youtube">YouTube (16:9 横屏)</option>
              </select>
            </div>
          </div>

          <!-- 视频时长 -->
          <div class="form-group">
            <label for="duration">视频时长</label>
            <div class="select-wrapper">
              <select id="duration" name="duration" required>
                <option value="15s">15 秒</option>
                <option value="30s" selected>30 秒</option>
                <option value="60s">60 秒</option>
              </select>
            </div>
          </div>

          <!-- 产品图上传 -->
          <div class="form-group full-width">
            <label>产品参考图</label>
            <div id="upload-zone" class="upload-zone">
              <input type="file" id="product_images" name="product_images"
                     accept="image/*" multiple hidden>
              <div class="upload-placeholder" id="upload-placeholder">
                <span class="upload-icon">&#128247;</span>
                <span>点击或拖拽上传产品图片 (1~3 张)</span>
              </div>
              <div class="upload-preview" id="upload-preview"></div>
            </div>
          </div>
        </div>

        <!-- 提交按钮 -->
        <button type="submit" class="btn-generate" id="btn-generate">
          <span class="btn-text">开始生成</span>
          <span class="btn-icon">&#10132;</span>
        </button>
      </form>
    </div>
  </section>

  <!-- ========== Step 2: 生成中 ========== -->
  <section id="step-progress" class="step">
    <div class="container">
      <header class="progress-header">
        <button class="btn-back" id="btn-back" title="返回">&#8592; 返回修改</button>
        <div class="logo-sm">
          <span class="logo-icon">&#9655;</span>
          <span class="logo-text">VlogForge</span>
        </div>
      </header>

      <!-- 流水线进度 -->
      <div class="pipeline card glass-card">
        <div class="pipeline-steps">
          <div class="pipeline-step" data-stage="script">
            <div class="pipeline-dot"></div>
            <span>脚本</span>
          </div>
          <div class="pipeline-line"></div>
          <div class="pipeline-step" data-stage="images">
            <div class="pipeline-dot"></div>
            <span>分镜图</span>
          </div>
          <div class="pipeline-line"></div>
          <div class="pipeline-step" data-stage="videos">
            <div class="pipeline-dot"></div>
            <span>视频</span>
          </div>
          <div class="pipeline-line"></div>
          <div class="pipeline-step" data-stage="qa">
            <div class="pipeline-dot"></div>
            <span>审核</span>
          </div>
          <div class="pipeline-line"></div>
          <div class="pipeline-step" data-stage="stitching">
            <div class="pipeline-dot"></div>
            <span>拼接</span>
          </div>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="progress-message" id="progress-message">准备中...</p>
      </div>

      <!-- 脚本预览 -->
      <div class="script-preview card glass-card" id="script-preview" style="display:none;">
        <h3 class="script-title" id="script-title"></h3>
        <div class="style-guide" id="style-guide"></div>
        <div class="segments-list" id="segments-list"></div>
      </div>

      <!-- 分镜图预览 -->
      <div class="storyboard-preview card glass-card" id="storyboard-preview" style="display:none;">
        <h3>分镜图</h3>
        <div class="storyboard-grid" id="storyboard-grid"></div>
      </div>
    </div>
  </section>

  <!-- ========== Step 3: 结果 ========== -->
  <section id="step-result" class="step">
    <div class="container">
      <header class="result-header">
        <div class="logo-sm">
          <span class="logo-icon">&#9655;</span>
          <span class="logo-text">VlogForge</span>
        </div>
      </header>

      <div class="result-layout">
        <!-- 视频播放器 -->
        <div class="video-card card glass-card">
          <video id="result-video" controls></video>
          <div class="video-actions">
            <a id="btn-download" class="btn-download" download>
              <span>&#11015;</span> 下载视频
            </a>
            <button class="btn-new" id="btn-new">
              <span>&#43;</span> 新建任务
            </button>
          </div>
        </div>

        <!-- 脚本详情 -->
        <div class="result-script card glass-card">
          <h3 id="result-title"></h3>
          <div id="result-segments"></div>
        </div>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
