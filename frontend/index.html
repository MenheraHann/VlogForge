<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VlogForge - AI Vlog 带货视频生成器</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ========== 背景装饰 ========== -->
  <div class="bg-gradient"></div>
  <div class="bg-noise"></div>

  <!-- ========== 顶部导航 ========== -->
  <nav class="nav-bar">
    <div class="nav-inner">
      <div class="logo" id="nav-logo">
        <span class="logo-icon">&#9655;</span>
        <span class="logo-text">VlogForge</span>
      </div>
    </div>
  </nav>

  <!-- ========== 主页：素材库 + 统一生成区 ========== -->
  <section id="view-home" class="view active">
    <div class="container-wide">

      <!-- 素材库三列 -->
      <div class="asset-columns">
        <!-- 物品列 -->
        <div class="asset-column">
          <div class="column-header">
            <h2>&#128230; 物品</h2>
            <span class="column-count" id="count-items">0</span>
          </div>
          <button class="btn-add" data-create="items">+ 添加物品</button>
          <div class="column-list" id="col-items"></div>
        </div>

        <!-- 人物列 -->
        <div class="asset-column">
          <div class="column-header">
            <h2>&#128100; 人物</h2>
            <span class="column-count" id="count-models">0</span>
          </div>
          <button class="btn-add" data-create="models">+ 添加人物</button>
          <div class="column-list" id="col-models"></div>
        </div>

        <!-- 场景列 -->
        <div class="asset-column">
          <div class="column-header">
            <h2>&#127968; 场景</h2>
            <span class="column-count" id="count-scenes">0</span>
          </div>
          <button class="btn-add" data-create="scenes">+ 添加场景</button>
          <div class="column-list" id="col-scenes"></div>
        </div>
      </div>

      <!-- 分隔线 -->
      <div class="section-divider">
        <span>生成视频</span>
      </div>

      <!-- 统一生成区 -->
      <div class="gen-area card glass-card">
        <!-- 一句话描述 + 快速创建 -->
        <div class="form-group">
          <label for="gen-prompt">一句话描述</label>
          <textarea id="gen-prompt" rows="2"
            placeholder="如：帮我拍一个亚洲女生在浴室推荐氨基酸洗面奶 / 开场要搞笑一点"></textarea>
          <div class="quickstart-row">
            <button class="btn-quickstart" id="btn-quickstart" type="button">
              <span class="btn-quickstart-icon">&#9889;</span> 一句话快速创建素材
            </button>
            <span class="quickstart-hint">AI 自动拆解为物品+人物+场景，一次创建三类素材</span>
          </div>
        </div>

        <!-- 三个拖拽槽位 -->
        <div class="slot-row">
          <!-- 物品槽位（必填） -->
          <div class="slot" id="slot-item" data-slot="item">
            <div class="slot-header">物品 <span class="required">*必填</span></div>
            <div class="slot-body slot-empty" id="slot-item-body">
              <span class="slot-icon">&#128230;</span>
              <span class="slot-hint">拖入素材 或 点击上传</span>
              <input type="file" class="slot-file-input" accept="image/*" multiple hidden>
            </div>
            <button class="slot-clear" id="slot-item-clear" style="display:none;">&#10005; 清空</button>
          </div>

          <!-- 人物槽位（可选） -->
          <div class="slot" id="slot-model" data-slot="model">
            <div class="slot-header">人物 <span class="optional">可选</span></div>
            <div class="slot-body slot-empty" id="slot-model-body">
              <span class="slot-icon">&#128100;</span>
              <span class="slot-hint">拖入素材 或 点击上传</span>
              <input type="file" class="slot-file-input" accept="image/*" hidden>
            </div>
            <button class="slot-clear" id="slot-model-clear" style="display:none;">&#10005; 清空</button>
          </div>

          <!-- 场景槽位（可选） -->
          <div class="slot" id="slot-scene" data-slot="scene">
            <div class="slot-header">场景 <span class="optional">可选</span></div>
            <div class="slot-body slot-empty" id="slot-scene-body">
              <span class="slot-icon">&#127968;</span>
              <span class="slot-hint">拖入素材 或 点击上传</span>
              <input type="file" class="slot-file-input" accept="image/*" hidden>
            </div>
            <button class="slot-clear" id="slot-scene-clear" style="display:none;">&#10005; 清空</button>
          </div>
        </div>

        <!-- 参数配置 -->
        <div class="form-row">
          <div class="form-group">
            <label for="gen-platform">目标平台</label>
            <div class="select-wrapper">
              <select id="gen-platform">
                <option value="douyin">抖音 (9:16 竖屏)</option>
                <option value="xiaohongshu">小红书 (9:16 竖屏)</option>
                <option value="youtube">YouTube (16:9 横屏)</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="gen-duration">视频时长</label>
            <div class="select-wrapper">
              <select id="gen-duration">
                <option value="15s">15 秒</option>
                <option value="30s" selected>30 秒</option>
                <option value="60s">60 秒</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 生成按钮 -->
        <button class="btn-generate" id="btn-generate" disabled>
          <span class="btn-text">开始生成</span>
          <span class="btn-icon">&#10132;</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ========== 创建素材模态框 ========== -->
  <div id="create-modal" class="modal-overlay" style="display:none;">
    <div class="modal card glass-card">
      <div class="modal-header">
        <h2 id="modal-title">创建素材</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- ========== 选择方案模态框 ========== -->
  <div id="select-modal" class="modal-overlay" style="display:none;">
    <div class="modal modal-lg card glass-card">
      <div class="modal-header">
        <h2 id="select-modal-title">选择方案</h2>
        <button class="modal-close" id="select-modal-close">&times;</button>
      </div>
      <div class="modal-body" id="select-modal-body"></div>
    </div>
  </div>

  <!-- ========== 素材详情模态框 ========== -->
  <div id="detail-modal" class="modal-overlay" style="display:none;">
    <div class="modal modal-lg card glass-card">
      <div class="modal-header">
        <h2 id="detail-modal-title">素材详情</h2>
        <button class="modal-close" id="detail-modal-close">&times;</button>
      </div>
      <div class="modal-body" id="detail-modal-body"></div>
    </div>
  </div>

  <!-- ========== 智能问卷模态框 ========== -->
  <div id="questionnaire-modal" class="modal-overlay" style="display:none;">
    <div class="modal modal-lg card glass-card">
      <div class="modal-header">
        <h2 id="questionnaire-title">产品信息确认</h2>
        <button class="modal-close" id="questionnaire-close">&times;</button>
      </div>
      <div class="modal-body" id="questionnaire-body"></div>
    </div>
  </div>

  <!-- ========== 进度视图 ========== -->
  <section id="view-progress" class="view">
    <div class="container">
      <header class="progress-header">
        <button class="btn-back" id="btn-back">&#8592; 返回</button>
        <div class="logo-sm">
          <span class="logo-icon">&#9655;</span>
          <span class="logo-text">VlogForge</span>
        </div>
      </header>

      <div class="pipeline card glass-card">
        <div class="pipeline-steps">
          <div class="pipeline-step" data-stage="script">
            <div class="pipeline-dot"></div>
            <span>脚本</span>
          </div>
          <div class="pipeline-line"></div>
          <div class="pipeline-step" data-stage="images">
            <div class="pipeline-dot"></div>
            <span>分镜图</span>
          </div>
          <div class="pipeline-line"></div>
          <div class="pipeline-step" data-stage="videos">
            <div class="pipeline-dot"></div>
            <span>视频</span>
          </div>
          <div class="pipeline-line"></div>
          <div class="pipeline-step" data-stage="stitching">
            <div class="pipeline-dot"></div>
            <span>拼接</span>
          </div>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="progress-message" id="progress-message">准备中...</p>
      </div>

      <div class="script-preview card glass-card" id="script-preview" style="display:none;">
        <h3 class="script-title" id="script-title"></h3>
        <div class="style-guide" id="style-guide"></div>
        <div class="segments-list" id="segments-list"></div>
      </div>

      <div class="storyboard-preview card glass-card" id="storyboard-preview" style="display:none;">
        <h3>分镜图</h3>
        <div class="storyboard-grid" id="storyboard-grid"></div>
      </div>
    </div>
  </section>

  <!-- ========== 结果视图 ========== -->
  <section id="view-result" class="view">
    <div class="container">
      <header class="result-header">
        <div class="logo-sm">
          <span class="logo-icon">&#9655;</span>
          <span class="logo-text">VlogForge</span>
        </div>
      </header>

      <div class="result-layout">
        <div class="video-card card glass-card">
          <video id="result-video" controls></video>
          <div class="video-actions">
            <a id="btn-download" class="btn-download" download>
              <span>&#11015;</span> 下载视频
            </a>
            <button class="btn-new" id="btn-new-task">
              <span>&#43;</span> 继续生成
            </button>
          </div>
        </div>
        <div class="result-script card glass-card">
          <h3 id="result-title"></h3>
          <div id="result-segments"></div>
        </div>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
