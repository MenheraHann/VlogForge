<!DOCTYPE html>
<html lang="zh-CN" data-i18n-title="app.title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VlogForge - AI Vlog 带货视频生成器</title>
  <link rel="stylesheet" href="styles.css?v=16.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* 语言切换器样式 */
    .lang-switcher-wrap {
      position: relative;
      margin-left: auto;
    }
    .lang-switcher {
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: var(--text-secondary, #aaa);
      font-size: 0.8rem;
      padding: 6px 28px 6px 10px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .lang-switcher:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--text-primary, #fff);
    }
    .lang-switcher:focus {
      border-color: var(--accent, #6366f1);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
    .lang-switcher option {
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .lang-switcher-wrap::after {
      content: "▾";
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted, #666);
      font-size: 0.7rem;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- ========== 背景装饰 ========== -->
  <div class="bg-gradient"></div>
  <div class="bg-noise"></div>

  <!-- ========== 顶部导航 ========== -->
  <nav class="nav-bar">
    <div class="nav-inner">
      <div class="logo" id="nav-logo">
        <span class="logo-icon">&#9655;</span>
        <span class="logo-text">VlogForge</span>
      </div>
      <!-- 语言切换器 -->
      <div class="lang-switcher-wrap">
        <select id="lang-switcher" class="lang-switcher">
          <option value="zh-CN">简体中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
          <option value="pt">Português</option>
        </select>
      </div>
    </div>
  </nav>

  <!-- ========== 主页：素材库 + 统一生成区 ========== -->
  <section id="view-home" class="view active">
    <div class="container-wide">

      <!-- 素材库两列 -->
      <div class="asset-columns">
        <!-- 物品列 -->
        <div class="asset-column">
          <div class="column-header">
            <h2 data-i18n-html="asset.itemsIcon">&#128230; 物品</h2>
            <span class="column-count" id="count-items">0</span>
          </div>
          <button class="btn-add" data-create="items" data-i18n="asset.addItem">+ 添加物品</button>
          <div class="column-list" id="col-items"></div>
        </div>

        <!-- 人物列 -->
        <div class="asset-column">
          <div class="column-header">
            <h2 data-i18n-html="asset.modelsIcon">&#128100; 人物</h2>
            <span class="column-count" id="count-models">0</span>
          </div>
          <button class="btn-add" data-create="models" data-i18n="asset.addModel">+ 添加人物</button>
          <div class="column-list" id="col-models"></div>
        </div>

      </div>

      <!-- 分隔线 -->
      <div class="section-divider">
        <span data-i18n="section.generateVideo">生成视频</span>
      </div>

      <!-- 统一生成区 -->
      <div class="gen-area card glass-card">
        <!-- 一句话描述 + 快速创建 -->
        <div class="form-group">
          <label for="gen-prompt" data-i18n="form.oneLineDesc">一句话描述</label>
          <textarea id="gen-prompt" rows="2"
            data-i18n-placeholder="form.oneLineDescPlaceholder"
            placeholder="如：帮我拍一个亚洲女生在浴室推荐氨基酸洗面奶 / 开场要搞笑一点"></textarea>
          <div class="quickstart-row">
            <button class="btn-quickstart" id="btn-quickstart" type="button">
              <span class="btn-quickstart-icon">&#9889;</span> <span data-i18n="button.quickstart">一句话快速创建素材</span>
            </button>
            <span class="quickstart-hint" data-i18n="form.quickstartHint">AI 自动拆解为物品+人物，一次创建两类素材</span>
          </div>
        </div>

        <!-- 两个拖拽槽位 -->
        <div class="slot-row">
          <!-- 物品槽位（必填） -->
          <div class="slot" id="slot-item" data-slot="item">
            <div class="slot-header"><span data-i18n="slot.item">物品</span> <span class="required" data-i18n="slot.itemRequired">*必填</span></div>
            <div class="slot-body slot-empty" id="slot-item-body">
              <span class="slot-icon">&#128230;</span>
              <span class="slot-hint" data-i18n="slot.dragOrUpload">拖入素材 或 点击上传</span>
              <input type="file" class="slot-file-input" accept="image/*" multiple hidden>
            </div>
            <button class="slot-clear" id="slot-item-clear" style="display:none;">&#10005; <span data-i18n="button.clear">清空</span></button>
          </div>

          <!-- 人物槽位（可选） -->
          <div class="slot" id="slot-model" data-slot="model">
            <div class="slot-header"><span data-i18n="slot.model">人物</span> <span class="optional" data-i18n="slot.modelOptional">可选</span></div>
            <div class="slot-body slot-empty" id="slot-model-body">
              <span class="slot-icon">&#128100;</span>
              <span class="slot-hint" data-i18n="slot.dragOrUpload">拖入素材 或 点击上传</span>
              <input type="file" class="slot-file-input" accept="image/*" hidden>
            </div>
            <button class="slot-clear" id="slot-model-clear" style="display:none;">&#10005; <span data-i18n="button.clear">清空</span></button>
          </div>

        </div>

        <!-- 参数配置 -->
        <div class="form-row">
          <div class="form-group">
            <label for="gen-platform" data-i18n="form.targetPlatform">目标平台</label>
            <div class="select-wrapper">
              <select id="gen-platform">
                <option value="douyin" data-i18n="platform.douyin">抖音 (9:16 竖屏)</option>
                <option value="xiaohongshu" data-i18n="platform.xiaohongshu">小红书 (9:16 竖屏)</option>
                <option value="youtube" data-i18n="platform.youtube">YouTube (16:9 横屏)</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="gen-segments"><span data-i18n="form.videoDuration">视频时长</span> <span id="gen-duration-label" class="duration-label">5 段 · 30s</span></label>
            <input type="range" id="gen-segments" min="3" max="10" value="5" step="1" class="duration-slider">
          </div>
        </div>

        <!-- 生成按钮 -->
        <button class="btn-generate" id="btn-generate" disabled>
          <span class="btn-text" data-i18n="button.generate">开始生成</span>
          <span class="btn-icon">&#10132;</span>
        </button>
        <div class="gen-hint" id="gen-hint"></div>
      </div>

      <!-- ========== 渲染队列面板 ========== -->
      <div id="render-queue-panel" class="render-queue-panel" style="display:none;">
        <div class="queue-header">
          <div class="queue-header-left">
            <h3 data-i18n-html="queue.title">&#127916; 渲染队列</h3>
            <span id="queue-count" class="queue-count">0</span>
          </div>
          <button class="queue-toggle" id="queue-toggle" data-i18n-title="queue.toggleTooltip" title="折叠/展开">&#9660;</button>
        </div>
        <div id="queue-list" class="queue-list">
          <!-- 动态渲染任务卡片 -->
        </div>
      </div>

    </div>
  </section>

  <!-- ========== 创建素材模态框 ========== -->
  <div id="create-modal" class="modal-overlay" style="display:none;">
    <div class="modal card glass-card">
      <div class="modal-header">
        <h2 id="modal-title" data-i18n="modal.createAsset">创建素材</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- ========== 选择方案模态框 ========== -->
  <div id="select-modal" class="modal-overlay" style="display:none;">
    <div class="modal modal-lg card glass-card">
      <div class="modal-header">
        <h2 id="select-modal-title" data-i18n="modal.selectPlan">选择方案</h2>
        <button class="modal-close" id="select-modal-close">&times;</button>
      </div>
      <div class="modal-body" id="select-modal-body"></div>
    </div>
  </div>

  <!-- ========== 素材详情模态框 ========== -->
  <div id="detail-modal" class="modal-overlay" style="display:none;">
    <div class="modal modal-lg card glass-card">
      <div class="modal-header">
        <h2 id="detail-modal-title" data-i18n="modal.assetDetail">素材详情</h2>
        <button class="modal-close" id="detail-modal-close">&times;</button>
      </div>
      <div class="modal-body" id="detail-modal-body"></div>
    </div>
  </div>

  <!-- ========== 图片预览 Lightbox ========== -->
  <div id="image-lightbox" class="lightbox-overlay" style="display:none;">
    <button class="lightbox-close">&times;</button>
    <img class="lightbox-img" src="" alt="Preview">
  </div>

  <!-- ========== 智能问卷模态框 ========== -->
  <div id="questionnaire-modal" class="modal-overlay" style="display:none;">
    <div class="modal modal-lg card glass-card">
      <div class="modal-header">
        <h2 id="questionnaire-title" data-i18n="modal.productInfoConfirm">产品信息确认</h2>
        <button class="modal-close" id="questionnaire-close">&times;</button>
      </div>
      <div class="modal-body" id="questionnaire-body"></div>
    </div>
  </div>

  <!-- ========== 进度视图 ========== -->
  <section id="view-progress" class="view">
    <div class="container">
      <header class="progress-header">
        <button class="btn-back" id="btn-back" data-i18n-html="button.back">&#8592; 返回</button>
        <div class="logo-sm">
          <span class="logo-icon">&#9655;</span>
          <span class="logo-text">VlogForge</span>
        </div>
      </header>

      <div class="pipeline card glass-card">
        <div class="pipeline-steps">
          <div class="pipeline-step" data-stage="script">
            <div class="pipeline-dot"></div>
            <span data-i18n="pipeline.script">脚本</span>
            <span class="pipeline-est" data-i18n="pipeline.scriptEst">~10s</span>
          </div>
          <div class="pipeline-line"></div>
          <div class="pipeline-step" data-stage="images">
            <div class="pipeline-dot"></div>
            <span data-i18n="pipeline.images">分镜图</span>
            <span class="pipeline-est" data-i18n="pipeline.imagesEst">~30s</span>
          </div>
          <div class="pipeline-line"></div>
          <div class="pipeline-step" data-stage="videos">
            <div class="pipeline-dot"></div>
            <span data-i18n="pipeline.videos">视频</span>
            <span class="pipeline-est" data-i18n="pipeline.videosEst">~2min</span>
          </div>
          <div class="pipeline-line"></div>
          <div class="pipeline-step" data-stage="stitching">
            <div class="pipeline-dot"></div>
            <span data-i18n="pipeline.stitching">拼接</span>
            <span class="pipeline-est" data-i18n="pipeline.stitchingEst">~15s</span>
          </div>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="progress-message" id="progress-message" data-i18n="pipeline.preparing">准备中...</p>
        <p class="progress-eta" id="progress-eta"></p>
      </div>

      <div class="script-preview card glass-card" id="script-preview" style="display:none;">
        <h3 class="script-title" id="script-title"></h3>
        <div class="style-guide" id="style-guide"></div>
        <div class="segments-list" id="segments-list"></div>
      </div>

      <div class="storyboard-preview card glass-card" id="storyboard-preview" style="display:none;">
        <h3 data-i18n="storyboard.title">分镜图</h3>
        <div class="storyboard-grid" id="storyboard-grid"></div>
      </div>

      <div id="segments-preview" class="storyboard-preview card glass-card" style="display: none">
        <h4 data-i18n="storyboard.videoSegments">视频片段预览</h4>
        <div id="segments-grid" class="storyboard-grid"></div>
      </div>
    </div>
  </section>

  <!-- ========== 结果视图 ========== -->
  <section id="view-result" class="view">
    <div class="container">
      <header class="result-header">
        <div class="logo-sm">
          <span class="logo-icon">&#9655;</span>
          <span class="logo-text">VlogForge</span>
        </div>
      </header>

      <div class="result-layout">
        <!-- 最终视频 -->
        <div class="video-card card glass-card">
          <video id="result-video" controls></video>
          <div class="video-actions">
            <a id="btn-download" class="btn-download" download>
              <span>&#11015;</span> <span data-i18n="result.downloadVideo">下载视频</span>
            </a>
            <button class="btn-new" id="btn-new-task">
              <span>&#43;</span> <span data-i18n="result.continueGenerate">继续生成</span>
            </button>
          </div>
        </div>

        <!-- 分镜图 -->
        <div id="result-storyboard-section" class="card glass-card" style="display:none">
          <h3 class="result-section-title" data-i18n="result.storyboard">分镜图</h3>
          <div id="result-storyboard-grid" class="result-storyboard-grid"></div>
        </div>

        <!-- 分段视频 -->
        <div id="result-segments-video-section" class="card glass-card" style="display:none">
          <h3 class="result-section-title" data-i18n="result.videoSegments">视频片段</h3>
          <div id="result-segments-video-grid" class="result-segments-video-grid"></div>
        </div>

        <!-- 脚本信息 -->
        <div class="result-script card glass-card">
          <h3 id="result-title"></h3>
          <div id="result-segments"></div>
        </div>
      </div>
    </div>
  </section>

  <script src="i18n.js?v=16.0"></script>
  <script src="app.js?v=16.0"></script>
</body>
</html>
